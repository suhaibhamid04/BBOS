name: Production Readiness

on:
  pull_request:
  push:
    branches: [main, audit/bbos-comprehensive-remediation]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NODE_ENV: test
      BBOS_ENVIRONMENT: test
      BBOS_DEMO_MODE: "true"
      VITE_BBOS_DEMO_MODE: "true"
      FIREBASE_PROJECT_ID: bbos-ci-emulator
      VITE_FIREBASE_PROJECT_ID: bbos-ci-emulator
      BBOS_FIRESTORE_DATABASE_ID: "(default)"
      VITE_BBOS_FIRESTORE_DATABASE_ID: "(default)"
      VITE_FIREBASE_EMULATOR: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: bun install --frozen-lockfile
      - run: bun run verify:repository
      - run: bun run verify:audit
      - run: bun run lint
      - run: bun test
      - run: bun run build
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
      - run: bun run test:rules
      - run: bun run test:e2e:firebase
      - run: git diff --check
